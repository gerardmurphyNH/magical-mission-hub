[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Coloring page files were renamed to keyword-rich filenames — 301 the old URLs.
[[redirects]]
  from = "/downloads/coloring-page.pdf"
  to = "/downloads/free-tooth-fairy-coloring-page.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/downloads/coloring-page.jpg"
  to = "/downloads/free-tooth-fairy-coloring-page.jpg"
  status = 301
  force = true

# Content consolidation (2026-09-01) — 3 thin/overlapping pages merged into 2
# deeper pillar pages. Each redirect target is topically identical to the
# source (not a generic catch-all), and the unique content from each retired
# page was merged into its destination rather than discarded, so these carry
# real relevance signal instead of just forwarding traffic.
[[redirects]]
  from = "/tooth-fairy-story-explained"
  to = "/is-the-tooth-fairy-real"
  status = 301
  force = true

[[redirects]]
  from = "/tooth-fairy-faq"
  to = "/is-the-tooth-fairy-real"
  status = 301
  force = true

[[redirects]]
  from = "/why-does-the-tooth-fairy-take-teeth"
  to = "/what-does-the-tooth-fairy-do-with-teeth"
  status = 301
  force = true

# Jar coloring page redrawn (2026-11-23) as "What's Inside Your Tooth?" with a
# keyword-rich filename. Old URLs may be bookmarked or pinned - 301 them.
[[redirects]]
  from = "/images/printable-tooth-fairy-coloring-page.jpg"
  to = "/downloads/tooth-fairy-coloring-page-whats-inside-your-tooth.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/downloads/tooth-fairy-coloring-page.pdf"
  to = "/downloads/tooth-fairy-coloring-page-whats-inside-your-tooth.pdf"
  status = 301
  force = true

# Not-found fallback — URLs without a prerendered file get the generic app shell
# (an empty #root), and React Router renders the NotFound page (noindex).
# Every real route has its own prerendered <route>.html, which Netlify serves
# before this rule runs, so only genuinely unknown URLs reach it. Status is 404
# (not 200) so search engines see a real 404 instead of a "soft 404". The
# target must NOT be index.html, which holds the rendered homepage.
# See scripts/prerender.mjs; seo.test.ts guards this rule.
[[redirects]]
  from = "/*"
  to = "/app-shell.html"
  status = 404
