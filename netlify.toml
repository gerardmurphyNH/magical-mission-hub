[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Collapse http://www -> https://apex to a single hop. Without this, Netlify's
# automatic HTTPS-enforce and www-alias-to-primary-domain redirects stack (one
# hop each), which Google Search Console flagged as a redirect-chain issue.
[[redirects]]
  from = "http://www.wigglytoothworkshop.com/*"
  to = "https://wigglytoothworkshop.com/:splat"
  status = 301
  force = true

# Coloring page files were renamed to keyword-rich filenames — 301 the old URLs.
[[redirects]]
  from = "/downloads/coloring-page.pdf"
  to = "/downloads/free-tooth-fairy-coloring-page.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/downloads/coloring-page.jpg"
  to = "/downloads/free-tooth-fairy-coloring-page.jpg"
  status = 301
  force = true

# SPA redirect — send all routes to index.html so React Router handles them.
# Without this, direct links to /news, /is-the-tooth-fairy-real etc. return 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
